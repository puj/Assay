# Merge to master → build → GitHub Release → store uploads.
#
# The GitHub Release (tag v<version>) is the immutable artifact: the exact
# assay-extension.zip attached to it is what gets uploaded to Firefox Add-ons
# and the Chrome Web Store, and what anyone can audit against the stores.
#
# Store uploads stay inert until these repo secrets exist (each store's FIRST
# listing is created by hand — see store/SUBMIT-CHECKLIST.md):
#   AMO_JWT_ISSUER / AMO_JWT_SECRET          addons.mozilla.org → Tools → Manage API Keys
#   CWS_CLIENT_ID / CWS_CLIENT_SECRET /
#   CWS_REFRESH_TOKEN                        Chrome Web Store API OAuth
#                                            (CWS_EXTENSION_ID defaults to the live listing)
#   EDGE_PRODUCT_ID / EDGE_CLIENT_ID /
#   EDGE_API_KEY                             Partner Center → Publish API (v1.1)
#
# A leg with no secrets skips rather than fails — and says so, as a warning
# and in the run summary, so a skipped upload never reads as a shipped one.
#
# Bump VERSION in src/assay.core.js per release: a version that already has
# a release is skipped, and the stores reject duplicate versions.

name: Release

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'extension/**'
      - 'build.js'
      - 'install.template.html'
      - '.github/workflows/release.yml'
  # Run by hand to re-send the current version to a store — the way to wire
  # up a store after the release already exists, or to retry an upload that
  # failed. It rebuilds from the chosen ref, so run it on the release's
  # commit; the build is reproducible, so that is the released zip.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Re-send the current version to a store'
        type: choice
        options: [none, chrome, firefox, edge, all]
        default: none

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - id: meta
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: assay-${{ steps.meta.outputs.version }}
          path: |
            assay-extension.zip
            assay.user.js
            install.html
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rel.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - id: rel
        name: Create GitHub Release v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" \
            dist/assay-extension.zip dist/assay.user.js dist/install.html \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Assay $TAG" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish-firefox:
    needs: [build, release]
    if: needs.release.outputs.created == 'true' || contains(fromJSON('["firefox","all"]'), github.event.inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit the released zip to AMO (listed channel)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "::warning title=Firefox publish skipped::AMO_JWT_ISSUER/AMO_JWT_SECRET are not set, so v$VERSION was not sent to Firefox Add-ons."
            echo "- **Firefox Add-ons** — skipped, no AMO secrets" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ext && unzip -q dist/assay-extension.zip -d ext
          if ! npx web-ext@8 sign --channel=listed \
              --source-dir=ext \
              --api-key="$AMO_JWT_ISSUER" \
              --api-secret="$AMO_JWT_SECRET" \
              --approval-timeout=0; then
            echo "- **Firefox Add-ons** — FAILED for v$VERSION (see the job log)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- **Firefox Add-ons** — submitted v$VERSION for review" >> "$GITHUB_STEP_SUMMARY"

  publish-chrome:
    needs: [build, release]
    if: needs.release.outputs.created == 'true' || contains(fromJSON('["chrome","all"]'), github.event.inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Upload the released zip to the Chrome Web Store
        env:
          # The live listing's id, overridable by a secret if it ever moves.
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID || 'pjffannabifdkfiealnipianjdeipgag' }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning title=Chrome publish skipped::CWS_CLIENT_ID/CWS_CLIENT_SECRET/CWS_REFRESH_TOKEN are not set, so v$VERSION was not sent to the Chrome Web Store."
            echo "- **Chrome Web Store** — skipped, no CWS secrets" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set -o pipefail
          if ! npx chrome-webstore-upload-cli@3 upload \
              --source dist/assay-extension.zip \
              --auto-publish 2>&1 | tee cws.log; then
            echo "- **Chrome Web Store** — FAILED for v$VERSION (see the job log)" >> "$GITHUB_STEP_SUMMARY"
            # Google's OAuth errors are terse; say what each one means here.
            if grep -q deleted_client cws.log; then
              echo "::error title=Chrome Web Store::Google says the OAuth client behind CWS_CLIENT_ID no longer exists. Create a new Desktop-app client in the Cloud project, run 'npm run cws-token' with it, and replace all three CWS_* secrets — a refresh token is bound to its client."
            elif grep -q invalid_grant cws.log; then
              echo "::error title=Chrome Web Store::Google rejected the refresh token: expired or revoked. A consent screen left in Testing expires tokens after seven days — publish it, run 'npm run cws-token' again, and replace CWS_REFRESH_TOKEN."
            elif grep -qi 'invalid_client\|unauthorized_client' cws.log; then
              echo "::error title=Chrome Web Store::Google did not accept CWS_CLIENT_ID/CWS_CLIENT_SECRET as a pair. Check both against APIs & Services → Credentials."
            elif grep -q 'Forbidden' cws.log; then
              # The CLI prints "errors: [Array]" and swallows the reason. Ask
              # the API about the item directly and show what it says.
              echo "Asking the Chrome Web Store why…"
              TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
                -d client_id="$CLIENT_ID" -d client_secret="$CLIENT_SECRET" \
                -d refresh_token="$REFRESH_TOKEN" -d grant_type=refresh_token \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
              if [ -n "$TOKEN" ]; then
                curl -sS "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID?projection=DRAFT" \
                  -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" | tee item.log
                echo
                if grep -q accessNotConfigured item.log; then
                  echo "::error title=Chrome Web Store::The Chrome Web Store API is not enabled in the Cloud project that owns this OAuth client. Enable it there (APIs & Services → Library → Chrome Web Store API) — enabling it in a different project does not count."
                elif grep -qi 'not own\|does not exist\|forbidden' item.log; then
                  echo "::error title=Chrome Web Store::The Google account you authorised cannot publish item $EXTENSION_ID. Authorise with the account that owns the listing (or one with publish rights on it) and mint the token again with 'npm run cws-token'."
                fi
              fi
            fi
            exit 1
          fi
          echo "- **Chrome Web Store** — uploaded v$VERSION, publishing on review" >> "$GITHUB_STEP_SUMMARY"

  # Edge Add-ons, through Partner Center's Publish API v1.1: upload the package
  # into the draft submission, wait for it to validate, then publish. Written
  # against the documented REST flow and inert until the secrets exist — the
  # first real run is the one that proves it, and every failure below prints
  # the API's own response.
  publish-edge:
    needs: [build, release]
    if: needs.release.outputs.created == 'true' || contains(fromJSON('["edge","all"]'), github.event.inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - name: Upload the released zip to Edge Add-ons
        env:
          PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          API_KEY: ${{ secrets.EDGE_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY:-}" ]; then
            echo "::warning title=Edge publish skipped::EDGE_PRODUCT_ID/EDGE_CLIENT_ID/EDGE_API_KEY are not set, so v$VERSION was not sent to Edge Add-ons."
            echo "- **Edge Add-ons** — skipped, no Edge secrets" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT_ID/submissions"
          AUTH=(-H "Authorization: ApiKey $API_KEY" -H "X-ClientID: $CLIENT_ID")

          # Poll an operation until it leaves InProgress, or give up after ~10 min.
          poll() { # $1 = operation URL
            for _ in $(seq 1 60); do
              sleep 10
              body=$(curl -sS "${AUTH[@]}" "$1")
              status=$(printf '%s' "$body" | python3 -c "import json,sys; print((json.load(sys.stdin) or {}).get('status',''))" 2>/dev/null || echo '')
              echo "  $status"
              case "$status" in
                Succeeded) return 0 ;;
                Failed|Cancelled) echo "$body"; return 1 ;;
              esac
            done
            echo "Timed out waiting for $1"; return 1
          }

          echo "Uploading the package…"
          loc=$(curl -sS -D - -o /dev/null -X POST "${AUTH[@]}" \
            -H "Content-Type: application/zip" \
            --data-binary @dist/assay-extension.zip \
            "$BASE/draft/package" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ -n "$loc" ] || { echo "No operation id came back from the package upload."; exit 1; }
          poll "$BASE/draft/package/operations/$loc"

          echo "Publishing…"
          loc=$(curl -sS -D - -o /dev/null -X POST "${AUTH[@]}" -H "Content-Length: 0" \
            "$BASE" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          [ -n "$loc" ] || { echo "No operation id came back from the publish call."; exit 1; }
          poll "$BASE/operations/$loc"
          echo "- **Edge Add-ons** — uploaded and published v$VERSION" >> "$GITHUB_STEP_SUMMARY"
