# Merge to master → build → GitHub Release → store uploads.
#
# The GitHub Release (tag v<version>) is the immutable artifact: the exact
# assay-extension.zip attached to it is what gets uploaded to Firefox Add-ons
# and the Chrome Web Store, and what anyone can audit against the stores.
#
# Store uploads stay inert until these repo secrets exist (each store's FIRST
# listing is created by hand — see store/SUBMIT-CHECKLIST.md):
#   AMO_JWT_ISSUER / AMO_JWT_SECRET          addons.mozilla.org → Tools → Manage API Keys
#   CWS_CLIENT_ID / CWS_CLIENT_SECRET /
#   CWS_REFRESH_TOKEN / CWS_EXTENSION_ID     Chrome Web Store API OAuth
#
# Bump VERSION in src/assay.core.js per release: a version that already has
# a release is skipped, and the stores reject duplicate versions.

name: Release

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'extension/**'
      - 'build.js'
      - 'install.template.html'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - id: meta
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: assay-${{ steps.meta.outputs.version }}
          path: |
            assay-extension.zip
            assay.user.js
            install.html
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rel.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - id: rel
        name: Create GitHub Release v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" \
            dist/assay-extension.zip dist/assay.user.js dist/install.html \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Assay $TAG" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish-firefox:
    needs: [build, release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit the released zip to AMO (listed channel)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "AMO secrets not configured - skipping Firefox publish."
            exit 0
          fi
          mkdir -p ext && unzip -q dist/assay-extension.zip -d ext
          npx web-ext@8 sign --channel=listed \
            --source-dir=ext \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --approval-timeout=0

  publish-chrome:
    needs: [build, release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assay-${{ needs.build.outputs.version }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Upload the released zip to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "Chrome Web Store secrets not configured - skipping Chrome publish."
            exit 0
          fi
          npx chrome-webstore-upload-cli@3 upload \
            --source dist/assay-extension.zip \
            --auto-publish
